name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `gateweave doctor track --json`
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `gateweave --version`.
  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: Node 22.12 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The command's output or its `--json` result. Remove any token, account id or address you want to keep private.
      render: text
