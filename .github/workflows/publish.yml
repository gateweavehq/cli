name: Publish

# Publishes the gateweave package to npm when a `v<version>` tag is pushed. npm trusts this
# workflow's OIDC token (trusted publishing), so no npm token is stored anywhere, and the package
# gets provenance. Who may push those tags is limited by a `v*` tag ruleset on the repository, and
# the tag must point at a commit on main whose packages/cli/package.json has that version. The
# job runs in the `npm` environment, whose deployment policy allows only `v*` tags, and npm's
# trusted publisher for this package must name that environment (`npm`) as well as this workflow:
# a run of this workflow from any branch then has no environment to present, and cannot publish.
# The tarball for pkg.gateweave.com is made by `pnpm --filter gateweave release` and holds the
# same files; that mirror is uploaded by hand. If the mirror already has this version, the packed
# bytes must match its SHA256SUMS (or the tarball itself, when SHA256SUMS is missing), or nothing
# is published: a version on npm can never be replaced.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'gateweavehq/cli'
    runs-on: ubuntu-latest
    environment: npm
    concurrency: publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match packages/cli/package.json ($version)"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter gateweave build
      # pnpm pack turns workspace: and catalog: references into versions. npm publishes, because
      # trusted publishing needs npm 11.5.1 or later.
      - name: Publish
        working-directory: packages/cli
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm --version
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/gateweave-*.tgz)
          version=${TAG#v}
          mine=$(sha256sum "$tgz" | cut -d' ' -f1)
          code=$(curl -sS -o "$RUNNER_TEMP/SHA256SUMS" -w '%{http_code}' "https://pkg.gateweave.com/cli/$version/SHA256SUMS")
          case "$code" in
            200)
              theirs=$(awk -v f="gateweave-$version.tgz" '$2 == f { print $1 }' "$RUNNER_TEMP/SHA256SUMS")
              if [ "$theirs" != "$mine" ]; then
                echo "::error::The mirror has $version with sha256 '$theirs', this build is $mine. Release a new version instead."
                exit 1
              fi ;;
            404)
              # The mirror's upload writes the tarball before SHA256SUMS, so a run that stopped
              # in between leaves a tarball whose digest is not recorded. Look at it directly.
              code=$(curl -sS -o "$RUNNER_TEMP/mirror.tgz" -w '%{http_code}' "https://pkg.gateweave.com/cli/$version/gateweave-$version.tgz")
              case "$code" in
                200)
                  theirs=$(sha256sum "$RUNNER_TEMP/mirror.tgz" | cut -d' ' -f1)
                  if [ "$theirs" != "$mine" ]; then
                    echo "::error::The mirror has a tarball for $version with sha256 '$theirs', this build is $mine. Release a new version instead."
                    exit 1
                  fi ;;
                404) echo "The mirror has nothing for $version yet." ;;
                *) echo "::error::The mirror answered $code for the tarball"; exit 1 ;;
              esac ;;
            *) echo "::error::The mirror answered $code"; exit 1 ;;
          esac
          # A prerelease must not become what `npx gateweave` runs, so it gets the next tag. A
          # stable release gets no --tag: npm then applies latest, and refuses it when a higher
          # stable version is already published.
          case "$TAG" in
            *-*) npm publish "$tgz" --access public --tag next ;;
            *) npm publish "$tgz" --access public ;;
          esac
