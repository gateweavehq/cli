name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the code, and a pull request's code must not get more than that. No job
# uses a secret: the tests fake Wrangler, git and pnpm, and nothing reaches Cloudflare.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # The release script checks the tarball it would upload and leaves a copy of that exact file.
      - name: Pack a release as it would be published
        shell: bash
        run: pnpm --filter gateweave release --dry-run --copy-to "$RUNNER_TEMP/release"
      # What npm would publish must be what that tarball holds. A dry run needs no login. It runs
      # offline with a cache of its own, so npm can't look up the registry: npm refuses a version
      # that is already published, and a prerelease without --tag, even in a dry run, and this
      # check must not depend on what the registry holds. The registry lookup fails quietly when
      # offline, so only the file list is checked here, as npm lists it.
      - name: Dry-run the npm publish
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tarball=$(ls "$RUNNER_TEMP"/release/gateweave-*.tgz)
          tar -tzf "$tarball" | sed 's#^package/##' | sort > "$RUNNER_TEMP/packed.txt"
          case "${tarball##*/}" in *-*-*.tgz) tag=next ;; *) tag=latest ;; esac
          npm publish "$tarball" --access public --tag "$tag" --dry-run --offline \
            --cache "$RUNNER_TEMP/npm-cache" --json > "$RUNNER_TEMP/dry.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const p=r.files?r:Object.values(r)[0];console.log(p.files.map((f)=>f.path).sort().join("\n"))' "$RUNNER_TEMP/dry.json" > "$RUNNER_TEMP/npm.txt"
          cat "$RUNNER_TEMP/npm.txt"
          diff "$RUNNER_TEMP/packed.txt" "$RUNNER_TEMP/npm.txt"
